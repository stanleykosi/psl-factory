<nav class="factory-queues" aria-label="Work item sections">
  <a href="{% url 'factory_detail' row.work.pk %}?queue={{ queue|default:'needs_me'|urlencode }}&amp;q={{ q|urlencode }}"{% if not focus %} aria-current="page"{% endif %}>Work item</a>
  <a href="{% url 'factory_invoice_decision' row.work.pk %}?queue={{ queue|default:'needs_me'|urlencode }}&amp;q={{ q|urlencode }}"{% if focus == 'decision' %} aria-current="page"{% endif %}>Decisions</a>
  {% if has_response %}<a href="{% url 'factory_work_response' row.work.pk %}?queue={{ queue|default:'needs_me'|urlencode }}&amp;q={{ q|urlencode }}"{% if focus == 'response' %} aria-current="page"{% endif %}>Record a response</a>{% endif %}
  <a href="{% url 'factory_invoice_recovery' row.work.pk %}?queue={{ queue|default:'needs_me'|urlencode }}&amp;q={{ q|urlencode }}"{% if focus == 'recovery' %} aria-current="page"{% endif %}>Receipts and recovery</a>
</nav>
