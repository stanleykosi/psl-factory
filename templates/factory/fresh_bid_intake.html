{% extends 'base.html' %}
{% block title %}Log a received bid · PSL Factory{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'factory_intake' %}?queue={{ queue }}&amp;q={{ q|urlencode }}">← Start work</a>
<div class="page-heading">
  <div><h1>Log a received bid</h1><p class="lede">Start a workspace for a bid you received and keep its original document.</p></div>
</div>
<section class="card shared-mobile-controls">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="definition" value="{{ definition }}">
    {{ form.as_p }}
    <button type="submit">Log bid</button>
  </form>
</section>
{% endblock %}
