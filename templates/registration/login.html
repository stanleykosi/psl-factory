{% extends 'base.html' %}{% load static %}{% block content %}
<div class="factory-login">
  <div class="factory-login-brand">
    <strong>PSL Factory</strong>
    <div class="factory-login-agents" aria-hidden="true">
      <img src="{% static 'factory-agents/tola.png' %}" alt="" width="128" height="128">
      <img src="{% static 'factory-agents/chidi.png' %}" alt="" width="128" height="128">
      <img src="{% static 'factory-agents/zainab.png' %}" alt="" width="128" height="128">
    </div>
    <p>Follow your work from the first draft to a verified result.</p>
  </div>
  <section class="factory-login-form">
    <h1>Sign in</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary">Sign in</button></form>
    <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  </section>
</div>
{% endblock %}
