ot([disabled]):hover, button[style*="background: #1F2427"]:not([aria-selected="true"]):not([disabled]):hover{background:#353D41!important}a[style*="background: #1F2427"]:not([aria-selected="true"]):not([disabled]):active, button[style*="background: #1F2427"]:not([aria-selected="true"]):not([disabled]):active{background:#0E1113!important}a[style*="inset 0 0 0 2px #1F2427"]:hover,button[style*="inset 0 0 0 2px #1F2427"]:not([disabled]):hover{background:#EEF0ED!important}a[style*="inset 0 0 0 2px #1F2427"]:active,button[style*="inset 0 0 0 2px #1F2427"]:not([disabled]):active{background:#E2E5E0!important}a[style*="inset 0 0 0 2px #9A2F10"]:hover,button[style*="inset 0 0 0 2px #9A2F10"]:not([disabled]):hover{background:#FBE3D9!important}[role=tab][aria-selected="false"]:hover,[role=radio][aria-checked="false"]:hover{background:#EEF0ED!important}[role=menu] a:hover,[role=menuitem]:hover{background:#EEF0ED!important}nav[aria-label="Main"] a[style*="color: #C8CDD0"]:hover{color:#FFFFFF!important;border-bottom-color:#C8CDD0!important}button[disabled],a[style*="background: #C9CDC7"],[aria-disabled="true"]{cursor:not-allowed}input:not([type=checkbox]):not([type=radio]):not([disabled]):hover,textarea:not([disabled]):hover,select:not([disabled]):hover{background-color:#F7F8F6}input:focus-visible,textarea:focus-visible,select:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid #2459D6!important;outline-offset:2px;background-color:#FFFFFF}::placeholder{color:#626B6F;opacity:1}input[type=checkbox],input[type=radio]{accent-color:#1F2427}[style*="background: #1F2427"] > input[type=radio],[style*="background: #1F2427"] > input[type=checkbox]{accent-color:#FFFFFF}@media (prefers-reduced-motion: reduce){a,button,[role=radio],[role=tab],input,select,textarea{transition:none}}</style></helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0ED; color: #1F2427; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column;">
  <div style="background: #1F2427; color: #FFFFFF; padding: 6px 16px; display: flex; justify-content: space-between; align-items: center;">
    <a href="SCR-01-mobile.dc.html" style="color: #FFFFFF; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none;">← Queue</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">INV-0412</span>
  </div>
  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; line-height: 1.1;">Lagoon Health · Milestone 2 invoice</h1>
      <span style="align-self: flex-start; padding: 3px 8px; font-size: 12px; font-weight: 600; background: #FBE3D9; color: #9A2F10; white-space: nowrap;">AWAITING FINANCE DECISION</span>
    </div>
    <section aria-label="Facts earned" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #1F2427; background: #FFFFFF;">
      <div style="padding: 8px; background: #1F2427; color: #FFFFFF; border-right: 2px solid #1F2427; border-bottom: 2px solid #1F2427;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">DRAFTED</span><span style="font-weight: 700;">v2</span></div>
      <div style="padding: 8px; background: #FBE3D9; color: #9A2F10; border-right: 2px solid #1F2427; border-bottom: 2px solid #1F2427;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">REVIEWED</span><span style="font-weight: 700;">Waiting</span></div>
      <div style="padding: 8px; color: #626B6F; border-bottom: 2px solid #1F2427;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">APPROVED</span><span style="font-weight: 700;">—</span></div>
      <div style="padding: 8px; color: #626B6F; border-right: 2px solid #1F2427;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">SENT</span><span style="font-weight: 700;">—</span></div>
      <div style="padding: 8px; color: #626B6F; border-right: 2px solid #1F2427;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">RECEIPT</span><span style="font-weight: 700;">—</span></div>
      <div style="padding: 8px; color: #626B6F;"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">VERIFIED</span><span style="font-weight: 700;">—</span></div>
    </section>
    <section aria-label="Stations" style="background: #FFFFFF; border: 2px solid #1F2427;">
      <ol style="list-style: none; margin: 0; padding: 0;">
        <sc-for list="{{stations}}" as="s" hint-placeholder-count="7">
          <li style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #D5D9D3; background: {{s.bg}}; color: {{s.color}};">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px;">{{s.n}}</span><span style="font-weight: 600; font-size: 14px;">{{s.name}}</span><span style="font-size: 12px;">{{s.status}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
    <div style="display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: #E9EEFB; border: 2px solid #2459D6;">
      <img src="/_blob/ecfb1b0df62c4684b66a6b97230ae2c5" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #DFE8FB;">

    </div>
  </div>
  <div style="padding: 12px 16px 18px; background: #FFFFFF; border-top: 2px solid #1F2427;">
    <a href="SCR-03-mobile.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; background: #2459D6; color: #FFFFFF; font-weight: 600; text-decoration: none; white-space: nowrap;">Review and decide</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (n, name, status, mode) => ({ n, name, status, bg: mode === 'now' ? '#FBE3D9' : '#FFFFFF', color: mode === 'todo' ? '#626B6F' : mode === 'now' ? '#9A2F10' : '#1F2427' });
    return { stations: [
      st('01', 'Milestone evidence', 'Done', 'done'), st('02', 'Contract amount', 'Done', 'done'), st('03', 'Draft invoice', 'Done', 'done'),
      st('04', 'Finance review', 'You · 2h', 'now'), st('05', 'Issue', 'Next', 'todo'), st('06', 'Deliver', '—', 'todo'), st('07', 'Verify', '—', 'todo')
    ] };
  }
}
</script>
