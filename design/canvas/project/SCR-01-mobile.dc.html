<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-01 · Work queue on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,700;125,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#2459D6}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0ED; color: #1F2427; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column;">
  <div style="background: #1F2427; color: #FFFFFF; padding: 6px 16px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-family: Archivo, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 16px;">PSL FACTORY</span>
    <a href="SCR-04-mobile.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; background: #C8401C; color: #FFFFFF; font-weight: 600; text-decoration: none;">Start</a>
  </div>
  <div style="padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 26px;">Work queue</h1>
    <div role="tablist" aria-label="Queues" style="display: flex; overflow-x: auto; border: 2px solid #1F2427;">
      <button type="button" role="tab" aria-selected="true" style="flex: none; min-height: 44px; padding: 0 12px; border: none; background: #1F2427; color: #FFFFFF; font: inherit; font-weight: 500;">Needs me 4</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 44px; padding: 0 12px; border: none; border-left: 2px solid #1F2427; background: #FFFFFF; font: inherit;">Decisions 3</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 44px; padding: 0 12px; border: none; border-left: 2px solid #1F2427; background: #FFFFFF; font: inherit;">Exceptions 2</button>
    </div>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <li><a href="SCR-02-mobile.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #FFFFFF; border: 2px solid #1F2427; text-decoration: none; color: #1F2427;">
        <span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-weight: 600;">{{r.title}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5357;">{{r.age}}</span></span>
        <span style="display: flex; gap: 3px;"><sc-for list="{{r.steps}}" as="s" hint-placeholder-count="6"><span style="flex: 1; height: 6px; background: {{s}};"></span></sc-for></span>
        <span style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;"><span style="padding: 2px 6px; font-size: 11px; font-weight: 600; background: {{r.bg}}; color: {{r.color}};">{{r.state}}</span><span style="font-size: 13px; color: #4A5357;">{{r.station}}</span></span>
      </a></li>
    </sc-for>
  </ul>
  <p style="margin: auto 16px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A5A00;">SAMPLE DATA</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = (n, at, hold) => Array.from({ length: n }, (_, i) => i < at ? '#1F2427' : i === at ? (hold ? '#C8401C' : '#2459D6') : '#D5D9D3');
    return { rows: [
      { title: 'Lagoon Health · M2 invoice', age: '2h', steps: steps(7, 3, true), state: 'AWAITING FINANCE DECISION', bg: '#FBE3D9', color: '#9A2F10', station: 'Finance review · you' },
      { title: 'Harmattan Bank · go-live report', age: '40m', steps: steps(5, 3, true), state: 'EFFECT UNCERTAIN', bg: '#FBE3D9', color: '#9A2F10', station: 'Checking delivery' },
      { title: 'Kora Logistics · SOW v3', age: '1d', steps: steps(6, 4, false), state: 'WAITING', bg: '#FFF1D6', color: '#6E4700', station: 'CEO approval · 3 of 3' },
      { title: 'Ojo Foods · ordering app plan', age: '3d', steps: steps(6, 2, true), state: 'OWNER NEEDED', bg: '#FBE3D9', color: '#9A2F10', station: 'No Design Lead role set' }
    ] };
  }
}
</script>
</body>
</html>
