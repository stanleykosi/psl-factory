<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout</title>
</head>
<body class="ds psl">
<div class="ds-stack" style="max-width: 640px;"><div class="psl-callout psl-callout--info"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="9" cy="9" r="7.2"/><path d="M9 8v4.6"/><rect x="8.1" y="4.8" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>Approving does not send the invoice. Finance sends it after review.</span></div><div class="psl-callout psl-callout--warning"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>The client has not replied for 5 days. Tola will remind them on Monday.</span></div><div class="psl-callout psl-callout--problem" role="alert"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span><strong>Can’t send yet.</strong> The report cites no record for "TBD". <a href="#">Add a source</a>.</span></div><div class="psl-callout psl-callout--success" role="status"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="9" cy="9" r="7.2"/><path d="M5.6 9.2l2.3 2.3 4.4-4.6"/></svg><span>Payment of ₦4,250,000.00 recorded against INV-0412.</span></div></div>
</body>
</html>
