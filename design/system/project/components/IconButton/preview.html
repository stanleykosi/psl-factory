<!-- @dsCard group="Actions" height=300 subtitle="Square 44px buttons that carry only an icon" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 120px;"><div class="ds-cell"><span class="ds-k">Default</span><button type="button" class="psl-iconbtn " aria-label="Filter"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button></div><div class="ds-cell"><span class="ds-k">Hover</span><button type="button" class="psl-iconbtn is-hover" aria-label="Filter"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button></div><div class="ds-cell"><span class="ds-k">Pressed</span><button type="button" class="psl-iconbtn is-pressed" aria-label="Filter"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button></div><div class="ds-cell"><span class="ds-k">Focus</span><button type="button" class="psl-iconbtn is-focus" aria-label="Filter"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button></div><div class="ds-cell"><span class="ds-k">Disabled</span><button type="button" class="psl-iconbtn " aria-label="Filter" disabled><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button></div><div class="ds-cell"><span class="ds-k">Bare · close</span><button type="button" class="psl-iconbtn psl-iconbtn--bare" aria-label="Close"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 4l10 10M14 4L4 14"/></svg></button></div><div class="ds-cell"><span class="ds-k">Bare · hover</span><button type="button" class="psl-iconbtn psl-iconbtn--bare is-hover" aria-label="More actions"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="2.5" y="8" width="2" height="2" fill="currentColor" stroke="none"/><rect x="8" y="8" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13.5" y="8" width="2" height="2" fill="currentColor" stroke="none"/></svg></button></div><div class="ds-cell"><span class="ds-k">With count</span><span style="position: relative; display: inline-flex;"><button type="button" class="psl-iconbtn" aria-label="Filter, 2 on"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg></button><span class="psl-badge psl-badge--signal" style="position: absolute; top: -8px; right: -8px;">2</span></span></div></div>
</body>
</html>
