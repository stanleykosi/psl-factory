<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 150px;"><div class="ds-cell"><span class="ds-k">Unchosen</span><label class="psl-radio "><input type="radio" name="a"><span>Won</span></label></div><div class="ds-cell"><span class="ds-k">Hover</span><label class="psl-radio is-hover"><input type="radio" name="b"><span>Won</span></label></div><div class="ds-cell"><span class="ds-k">Focus</span><label class="psl-radio is-focus"><input type="radio" name="c"><span>Won</span></label></div><div class="ds-cell"><span class="ds-k">Chosen</span><label class="psl-radio "><input type="radio" name="d" checked><span>Won</span></label></div><div class="ds-cell"><span class="ds-k">Error</span><label class="psl-radio is-error"><input type="radio" name="e"><span>Won</span></label></div><div class="ds-cell"><span class="ds-k">Disabled</span><label class="psl-radio is-disabled"><input type="radio" name="f" disabled><span>Withdrawn<small>Only before submission</small></span></label></div></div><h3 class="ds-sec">Choice cards</h3><div class="ds-grid" style="--ds-col: 300px;"><div class="ds-cell ds-cell--fill"><span class="ds-k">Chosen</span><label class="psl-choice is-selected"><input type="radio" name="g" checked><span><strong>Keep it owed and ask for the tax certificate</strong><small>The ₦500,000.00 stays on INV-0398 until the certificate arrives.</small></span></label></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Default</span><label class="psl-choice"><input type="radio" name="g"><span><strong>Approve an exception</strong><small>Records your decision and reason. It doesn’t erase the debt or release other controls.</small></span></label></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Hover</span><label class="psl-choice is-hover"><input type="radio" name="h"><span><strong>Approve an exception</strong><small>Records your decision and reason.</small></span></label></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Focus</span><label class="psl-choice is-focus"><input type="radio" name="i"><span><strong>Approve an exception</strong><small>Records your decision and reason.</small></span></label></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Error</span><label class="psl-choice is-error"><input type="radio" name="j"><span><strong>Approve an exception</strong><small>Choose one option to continue.</small></span></label></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Disabled</span><label class="psl-choice is-disabled"><input type="radio" name="k" disabled><span><strong>Write off</strong><small>Not set up: needs a write-off rule from PSL.</small></span></label></div></div>
</body>
</html>
