<!-- @dsCard group="Overlays" height=560 subtitle="Phone panel that rises from the bottom" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BottomSheet</title>
</head>
<body class="ds psl">
<div class="ds-phone" style="height: 520px; position: relative;"><div class="psl-scrim" style="position: absolute; inset: 0;"></div><div class="psl-sheet" role="dialog" aria-label="Filter" style="position: absolute; left: 0; right: 0; bottom: 0;"><span class="psl-sheet__grab" aria-hidden="true"></span><div class="psl-sheet__head"><strong style="font-family: var(--font-display); font-size: 18px;">Filter</strong><button type="button" class="psl-iconbtn psl-iconbtn--bare" aria-label="Close"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 4l10 10M14 4L4 14"/></svg></button></div><div class="psl-sheet__body"><span class="ds-k">State</span><div role="radiogroup" class="psl-seg psl-seg--phone"><button type="button" role="radio" class="psl-seg__opt " aria-checked="false">Any<span class="psl-badge">32</span></button><button type="button" role="radio" class="psl-seg__opt " aria-checked="true">Needs a person<span class="psl-badge">4</span></button><button type="button" role="radio" class="psl-seg__opt " aria-checked="false">Waiting<span class="psl-badge">9</span></button></div><span class="ds-k">Line</span><label class="psl-check "><input type="checkbox" checked><span>Invoice preparation</span></label><label class="psl-check "><input type="checkbox"><span>Go-live acceptance</span></label></div><div class="psl-sheet__foot"><button type="button" class="psl-btn psl-btn--xl psl-btn--block">Show 4 results</button><button type="button" class="psl-btn psl-btn--text">Clear all</button></div></div></div>
</body>
</html>
