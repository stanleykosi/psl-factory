<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 240px;"><div class="ds-cell"><span class="ds-k">Loading</span><span class="psl-loading" role="status"><span class="psl-busy" aria-hidden="true"><i></i><i></i><i></i></span>Loading figures…</span></div><div class="ds-cell ds-cell--fill"><span class="ds-k">List placeholder</span><div class="psl-panel" style="width: 100%; padding: 12px; display: grid; gap: 10px;" aria-hidden="true"><span class="psl-skel" style="width: 70%;"></span><span class="psl-skel" style="width: 45%;"></span><span class="psl-skel" style="width: 60%;"></span></div></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Progress</span><div style="width: 100%;"><div class="psl-progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i style="width: 62%;"></i></div><span class="psl-mono" style="font-size: 12px; color: var(--ink-muted);">214 of 345 rows</span></div></div></div><div class="ds-grid" style="--ds-col: 320px;"><div class="ds-cell ds-cell--fill"><span class="ds-k">Empty</span><div class="psl-empty" style="width: 100%;"><h3>Nothing needs you right now</h3><p>New work appears here when a station needs your decision.</p><button type="button" class="psl-btn psl-btn--start"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2v14M2 9h14"/></svg>Start work</button></div></div><div class="ds-cell ds-cell--fill"><span class="ds-k">Error with retry</span><div class="ds-stack" style="width: 100%;"><div class="psl-callout psl-callout--problem" role="alert"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span><strong>Couldn’t load the queue.</strong> Your work is safe; nothing was changed.</span></div><button type="button" class="psl-btn psl-btn--secondary">Retry</button></div></div></div>
</body>
</html>
