<!-- @dsCard group="Overlays" height=300 subtitle="Decision actions in thumb reach on phones" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneActionBar</title>
</head>
<body class="ds psl">
<div class="ds-rowx" style="align-items: flex-start; gap: 24px;"><div class="ds-phone"><div class="psl-actionbar"><button type="button" class="psl-btn psl-btn--xl psl-btn--block">Approve v3</button><div class="psl-actionbar__pair"><button type="button" class="psl-btn psl-btn--secondary psl-btn--lg">Return</button><button type="button" class="psl-btn psl-btn--reject psl-btn--lg">Reject</button></div><span class="psl-doesnt">Approving does not send the invoice.</span></div></div><div class="ds-phone"><div class="psl-actionbar"><button type="button" class="psl-btn psl-btn--xl psl-btn--block is-busy" aria-busy="true"><span class="psl-busy" aria-hidden="true"><i></i><i></i><i></i></span>Approving…</button><div class="psl-actionbar__pair"><button type="button" class="psl-btn psl-btn--secondary psl-btn--lg" disabled>Return</button><button type="button" class="psl-btn psl-btn--reject psl-btn--lg" disabled>Reject</button></div><span class="psl-doesnt">Recording your decision…</span></div></div></div>
</body>
</html>
