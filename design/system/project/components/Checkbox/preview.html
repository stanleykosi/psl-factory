<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 220px;"><div class="ds-cell"><span class="ds-k">Unchecked</span><label class="psl-check "><input type="checkbox"><span>Invoice preparation</span></label></div><div class="ds-cell"><span class="ds-k">Hover</span><label class="psl-check is-hover"><input type="checkbox"><span>Invoice preparation</span></label></div><div class="ds-cell"><span class="ds-k">Focus</span><label class="psl-check is-focus"><input type="checkbox"><span>Invoice preparation</span></label></div><div class="ds-cell"><span class="ds-k">Checked</span><label class="psl-check "><input type="checkbox" checked><span>Invoice preparation</span></label></div><div class="ds-cell"><span class="ds-k">Mixed · select all</span><label class="psl-check"><input type="checkbox" class="is-mixed"><span>Select all · 3 of 8</span></label></div><div class="ds-cell"><span class="ds-k">Error</span><label class="psl-check is-error"><input type="checkbox"><span>I confirm this proof is genuine</span></label><span class="psl-error"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>Confirm before recording.</span></span></div><div class="ds-cell"><span class="ds-k">Disabled</span><label class="psl-check is-disabled"><input type="checkbox" disabled><span>Payroll<small>Restricted to HR</small></span></label></div><div class="ds-cell"><span class="ds-k">Disabled · checked</span><label class="psl-check is-disabled"><input type="checkbox" checked disabled><span>Agreed scope<small>Locked once the SOW is signed</small></span></label></div></div>
</body>
</html>
