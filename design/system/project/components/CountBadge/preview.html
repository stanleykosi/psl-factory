<html lang="en">
<head>

<body class="ds psl">
<div class="ds-grid" style="--ds-col: 150px;"><div class="ds-cell"><span class="ds-k">On light</span><span class="psl-badge">4</span></div><div class="ds-cell"><span class="ds-k">Zero</span><span class="psl-badge">0</span></div><div class="ds-cell"><span class="ds-k">Large</span><span class="psl-badge">128</span></div><div class="ds-cell"><span class="ds-k">On a selected tab</span><span style="background: var(--ink); padding: 8px 12px; color: var(--on-strong); display: inline-flex; gap: 6px; align-items: center;">Needs me<span class="psl-badge psl-badge--on-dark">4</span></span></div><div class="ds-cell"><span class="ds-k">Needs you</span><span class="psl-badge psl-badge--signal">2</span></div></div>
</body>
