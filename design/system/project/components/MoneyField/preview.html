<!-- @dsCard group="Forms" height=330 subtitle="Naira amounts in mono, with Unknown as a value" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyField</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 240px;"><div class="ds-cell"><span class="ds-k">Empty</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Amount</label><span class="psl-input psl-input--money "><span class="psl-affix">₦</span><input value="" aria-label="Amount"></span><span class="psl-hint">Before tax.</span></div></div><div class="ds-cell"><span class="ds-k">Focus</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Amount</label><span class="psl-input psl-input--money is-focus"><span class="psl-affix">₦</span><input value="4,250,0" aria-label="Amount"></span></div></div><div class="ds-cell"><span class="ds-k">Filled</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Amount</label><span class="psl-input psl-input--money "><span class="psl-affix">₦</span><input value="4,250,000.00" aria-label="Amount"></span></div></div><div class="ds-cell"><span class="ds-k">Error</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Amount</label><span class="psl-input psl-input--money is-error"><span class="psl-affix">₦</span><input value="-500" aria-label="Amount"></span><span class="psl-error"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>An amount can’t be below zero.</span></span></div></div><div class="ds-cell"><span class="ds-k">From the contract</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Milestone amount</label><span class="psl-input psl-input--money is-readonly"><span class="psl-affix">₦</span><input value="4,250,000.00" aria-label="Amount"></span><span class="psl-hint">From SOW-0031 · stage 2.</span></div></div><div class="ds-cell"><span class="ds-k">Unknown</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Change amount</label><span class="psl-input is-readonly"><span class="psl-unknown">Unknown</span></span><span class="psl-hint">Set once a SOW amendment is signed.</span></div></div></div>
</body>
</html>
