<h3 class="ds-sec">Default</h3><div class="psl-toolbar"><div class="psl-search" style="flex: 1 1 320px; max-width: 460px;"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M11.8 11.8L16 16"/></svg><input class="psl-input " value="" placeholder="Search work, projects or references"></div><button type="button" class="psl-btn psl-btn--secondary"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg>Filter</button><span class="psl-resultcount">32 items</span></div><h3 class="ds-sec">Filters applied</h3><div class="psl-toolbar"><div class="psl-search" style="flex: 1 1 320px; max-width: 460px;"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M11.8 11.8L16 16"/></svg><input class="psl-input " value="" placeholder="Search work, projects or references"></div><button type="button" class="psl-btn psl-btn--secondary"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 3h14l-5.5 6.5V15l-3 1.5V9.5z" stroke-linejoin="round"/></svg>Filter <span class="psl-badge psl-badge--signal">2</span></button><span class="psl-resultcount">4 of 32</span></div><div class="ds-rowx" style="margin-top: 10px;"><span class="psl-chip"><span>Line</span><strong>Invoice preparation</strong><button type="button" class="" aria-label="Remove Line filter">×</button></span><span class="psl-chip"><span>State</span><strong>Needs a person</strong><button type="button" class="is-hover" aria-label="Remove State filter">×
