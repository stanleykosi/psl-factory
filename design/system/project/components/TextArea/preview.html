<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextArea</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 280px;"><div class="ds-cell"><span class="ds-k">Empty</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Reason for returning</label><textarea class="psl-input psl-input--area" placeholder="Say what needs to change before you approve."></textarea></div></div><div class="ds-cell"><span class="ds-k">Focus</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Reason for returning</label><textarea class="psl-input psl-input--area is-focus">The tax line uses the old rate</textarea></div></div><div class="ds-cell"><span class="ds-k">With count</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Note to the client</label><textarea class="psl-input psl-input--area">Thanks for confirming the milestone.</textarea><span class="psl-count">38 / 500</span></div></div><div class="ds-cell"><span class="ds-k">Error</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Reason for rejecting</label><textarea class="psl-input psl-input--area is-error" aria-invalid="true"></textarea><span class="psl-error"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>A reason is needed to reject.</span></span></div></div><div class="ds-cell"><span class="ds-k">Over the limit</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Summary</label><textarea class="psl-input psl-input--area is-error">Weekly progress on the patient app. Weekly progress on the patient app. </textarea><span class="psl-count is-over">512 / 500</span></div></div><div class="ds-cell"><span class="ds-k">Disabled</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Reviewer note</label><textarea class="psl-input psl-input--area" disabled>Only the PMO Lead can add a note.</textarea></div></div></div>
</body>
</html>
