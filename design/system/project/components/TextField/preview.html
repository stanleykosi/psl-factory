<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextField</title>
</head>
<body class="ds psl">
<div class="ds-grid" style="--ds-col: 260px;"><div class="ds-cell"><span class="ds-k">Empty</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input " value="" placeholder="e.g. Ifeoma Nwosu"></div></div><div class="ds-cell"><span class="ds-k">Hover</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input is-hover" value="" placeholder="e.g. Ifeoma Nwosu"></div></div><div class="ds-cell"><span class="ds-k">Focus</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input is-focus" value="Ifeo" placeholder=""></div></div><div class="ds-cell"><span class="ds-k">Filled</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input " value="Ifeoma Nwosu" placeholder=""><span class="psl-hint">Gets the invoice by email.</span></div></div><div class="ds-cell"><span class="ds-k">Error</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input is-error" value="" placeholder="" aria-invalid="true"><span class="psl-error"><svg class="psl-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 2L16.5 15.5H1.5Z" stroke-linejoin="round" stroke-linecap="butt"/><path d="M9 7v3.6"/><rect x="8.1" y="12" width="1.8" height="1.8" fill="currentColor" stroke="none"/></svg><span>Add who receives the invoice.</span></span></div></div><div class="ds-cell"><span class="ds-k">Disabled</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input " value="Ifeoma Nwosu" placeholder="" disabled><span class="psl-hint">Set on the engagement. Change it there.</span></div></div><div class="ds-cell"><span class="ds-k">Read-only</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Project</label><input class="psl-input " value="Lagoon Health · patient app" placeholder="" readonly></div></div><div class="ds-cell"><span class="ds-k">Optional</span><div class="psl-field" style="width: 100%;"><label class="psl-label">PO number <span class="psl-opt">(optional)</span></label><input class="psl-input " value="" placeholder="e.g. PO-7781"></div></div><div class="ds-cell"><span class="ds-k">Phone · 48px</span><div class="psl-field" style="width: 100%;"><label class="psl-label">Client contact</label><input class="psl-input psl-input--phone" value="Ifeoma Nwosu" placeholder=""></div></div></div>
</body>
</html>
