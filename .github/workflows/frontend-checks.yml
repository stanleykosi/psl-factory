# The same checks as delivery/checks.sh, run on GitHub's runners so feature gates
# don't queue on one laptop (D-199). delivery/checks.sh waits for this run's result
# for the exact commit when PSL_CHECKS_MODE=ci.
name: frontend-checks

on:
  push:
    branches: ['main', 'fe-**', 'ci-**', 'dlv-**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-checks-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psl
          POSTGRES_PASSWORD: psl
          POSTGRES_DB: psl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U psl" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGDATABASE: psl
      PGUSER: psl
      PGPASSWORD: psl
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PSL_ENV: development
      PSL_DJANGO_UI: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/mock-contract.test.ts diffs fixtures against an older commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.deploy.txt
      - name: backend · install
        run: pip install -r requirements.lock -r requirements.deploy.txt  # as the Dockerfile does
      - name: backend · django system check
        run: python manage.py check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend · install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: frontend · lint
        working-directory: frontend
        run: npm run lint
      - name: frontend · typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: frontend · unit tests
        working-directory: frontend
        run: npm test --if-present
      - name: frontend · build
        working-directory: frontend
        run: npm run build
